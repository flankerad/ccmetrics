<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140" role="img" aria-label="ccmetrics logo: four model-coloured bars with tokens leaking from the tallest, beside the ccmetrics wordmark">
  <style>
    /* the dashboard's own tokens, from dash/static/index.html :root
       (--haiku, --sonnet, --opus, --fable, --clay, --ink, --dim), darkened
       here for white backgrounds; .tag text measures ~4.9:1 on #fff. */
    .haiku  { fill: #5f6b80; }
    .sonnet { fill: #3f7780; }
    .opus   { fill: #4a6ba3; }
    .fable  { fill: #7a55a3; }
    .clay   { fill: #b35c33; }
    .word { font: 700 56px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #221e1a; }
    .tag  { font: 400 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #6b665d; }
  </style>
  <!-- header mark, scaled: bars width 20, gap 10, rx 2, baseline y=96;
       heights 30/50/70/40 = the header's 6/10/14/8 × 5. -->
  <g>
    <rect class="haiku"  x="20"  y="66" width="20" height="30" rx="2"/>
    <rect class="sonnet" x="50"  y="46" width="20" height="50" rx="2"/>
    <rect class="opus"   x="80"  y="26" width="20" height="70" rx="2"/>
    <rect class="fable"  x="110" y="56" width="20" height="40" rx="2"/>
    <!-- tokens leaking from the tallest (opus) bar, centred at x=90 -->
    <path class="clay" d="M90 104 c2.6 3.9 5 6.5 5 9.6 a5 5 0 1 1 -10 0 c0 -3.1 2.4 -5.7 5 -9.6 z"/>
    <path class="clay" opacity="0.65" d="M90 120 c1.9 2.9 3.7 4.8 3.7 7.1 a3.7 3.7 0 1 1 -7.4 0 c0 -2.3 1.8 -4.2 3.7 -7.1 z"/>
    <path class="clay" opacity="0.35" d="M90 132 c1.3 2 2.6 3.4 2.6 5 a2.6 2.6 0 1 1 -5.2 0 c0 -1.6 1.3 -3 2.6 -5 z"/>
  </g>
  <text class="word" x="170" y="80">ccmetrics</text>
  <text class="tag" x="173" y="110">the token leak meter for Claude Code</text>
</svg>
