<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" height="170" role="img" aria-label="ccmetrics logo: a spend bar chart with tokens leaking from one bar">
  <style>
    .bar  { fill: #3d444d; }
    .hot  { fill: #d97757; }
    .word { font: 700 58px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .cc   { fill: #d97757; }
    .rest { fill: #e6edf3; }
    .tag  { font: 400 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #9198a1; }
  </style>
  <!-- sparkline ▂▃▅▇▅▆█ · baseline y=108 · the ▇ bar leaks -->
  <g>
    <rect class="bar" x="22"  y="86"  width="16" height="22" rx="2"/>
    <rect class="bar" x="46"  y="75"  width="16" height="33" rx="2"/>
    <rect class="bar" x="70"  y="53"  width="16" height="55" rx="2"/>
    <rect class="hot" x="94"  y="31"  width="16" height="77" rx="2"/>
    <rect class="bar" x="118" y="53"  width="16" height="55" rx="2"/>
    <rect class="bar" x="142" y="42"  width="16" height="66" rx="2"/>
    <rect class="bar" x="166" y="20"  width="16" height="88" rx="2"/>
    <!-- tokens dripping from the hot bar -->
    <path class="hot" d="M102 118 c2.6 3.9 5 6.5 5 9.6 a5 5 0 1 1 -10 0 c0 -3.1 2.4 -5.7 5 -9.6 z"/>
    <path class="hot" opacity="0.65" d="M102 140 c1.9 2.9 3.7 4.8 3.7 7.1 a3.7 3.7 0 1 1 -7.4 0 c0 -2.3 1.8 -4.2 3.7 -7.1 z"/>
    <path class="hot" opacity="0.35" d="M102 156 c1.3 2 2.6 3.4 2.6 5 a2.6 2.6 0 1 1 -5.2 0 c0 -1.6 1.3 -3 2.6 -5 z"/>
  </g>
  <text class="word" x="208" y="92"><tspan class="cc">cc</tspan><tspan class="rest">metrics</tspan></text>
  <text class="tag" x="212" y="126">the token leak meter for Claude Code</text>
</svg>
