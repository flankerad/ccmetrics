<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="ccmetrics terminal summary: spend floor, plan percentages, token mix, per-model table, and the top leak with its paste-ready fix">
  <style>
    text { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 15px; fill: #58d365; white-space: pre; }
