<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccmetrics</title>
<style>
:root{
  --bg:#191714;--surf:#221e1a;--line:#3a352e;--ink:#ece7df;--dim:#8f887c;
  --clay:#d9825a;--l0:#2b2a26;--l1:#4f7a58;--l2:#9aa04a;--l3:#c8873c;--l4:#bd4a3a;
  --opus:#7594c9;--fable:#a37fc9;--sonnet:#5f9fa8;--haiku:#8f9cb0;--opus48:#6b83b0;
}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;image-rendering:pixelated}
a{color:var(--clay);text-decoration:none}a:hover{color:#f4c7ad}
.px-panel{border:2px solid var(--line);background:var(--surf);padding:18px 20px 20px}
.px-label{color:var(--dim);letter-spacing:0.12em;text-transform:uppercase}
.px-faint{color:#6f695f}
@keyframes ccpix{0%,33.32%{opacity:1}33.33%,100%{opacity:0}}
@keyframes ccpix2{0%,33.32%{opacity:0}33.33%,66.65%{opacity:1}66.66%,100%{opacity:0}}
@keyframes ccpix3{0%,66.65%{opacity:0}66.66%,100%{opacity:1}}
@keyframes ccblink{0%,49%{opacity:1}50%,100%{opacity:0}}
/* LEGACY BRIDGE — keeps not-yet-rebuilt panels legible; phase 12-pixel-stories deletes it. */
:root{
  --color-bg:var(--bg);--color-surface:var(--surf);--color-divider:var(--line);
  --color-text:var(--ink);
  --color-neutral-100:var(--ink);--color-neutral-200:var(--ink);--color-neutral-300:#c9c2b6;
  --color-neutral-400:var(--dim);--color-neutral-500:var(--dim);--color-neutral-600:#6f695f;
  --color-neutral-700:#555047;--color-neutral-800:var(--line);--color-neutral-900:#2a2622;
  --color-accent:var(--clay);--color-accent-200:#f4c7ad;--color-accent-300:#e8a37e;
  --color-accent-500:var(--clay);--color-accent-700:#a35f3f;--color-accent-900:#5c3826;
  --lvl-0:var(--l0);--lvl-1:var(--l1);--lvl-2:var(--l2);--lvl-3:var(--l3);--lvl-4:var(--l4);
  --m-opus:var(--opus);--m-fable:var(--fable);--m-sonnet:var(--sonnet);
  --m-haiku:var(--haiku);--m-opus48:var(--opus48);
  --font-body:ui-monospace,'SF Mono',Menlo,monospace;--font-heading:ui-monospace,'SF Mono',Menlo,monospace;
  --radius-sm:0;--radius-md:0;--radius-lg:0;--shadow-sm:none;--space-2:8px;
}
.cc-ribbon{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--surf);padding:11px 13px;color:var(--dim)}
</style>
</head>
<body>
<div style="min-height:100vh;background:var(--bg);color:var(--ink);font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;padding:28px 32px 56px;image-rendering:pixelated">

  <div id="cc-header"></div>

  <div id="cc-ribbon"></div>
  <div id="cc-hero"></div>
  <div id="cc-recoverable"></div>
  <div id="cc-week"></div>
  <div id="cc-live"></div>
  <div id="cc-horizon"></div>
  <div id="cc-projects"></div>
  <div id="cc-dollars"></div>
  <div id="cc-footer"></div>
</div>
<script>
(function () {
"use strict";

/* ==== PLAN-dash-v2 6.1: renderVals()'s presentation maths, ported verbatim
   where it is presentation (LVL/lvlOf/fillColor/inkOn/leftColor), except the
   verdict copy (decision 6) and dry-logic when caps are unknown (6.3). ==== */

var LVL = ["var(--lvl-0)", "var(--lvl-1)", "var(--lvl-2)", "var(--lvl-3)", "var(--lvl-4)"];
function lvlOf(p) {
  if (p === null || p === undefined) return 0;
  return p >= 95 ? 4 : p >= 75 ? 3 : p >= 45 ? 2 : p > 0 ? 1 : 0;
}
function fillColor(p) { return LVL[lvlOf(p)]; }
function inkOn(p) { var l = lvlOf(p); return (l === 2 || l === 3) ? "var(--color-bg)" : "var(--color-neutral-100)"; }
function leftColor(pctLeft) {
  if (pctLeft === null || pctLeft === undefined) return "var(--color-neutral-500)";
  return pctLeft <= 10 ? LVL[4] : pctLeft <= 25 ? LVL[3] : pctLeft <= 55 ? LVL[2] : LVL[1];
}
/* ==== PLAN-fill-and-clock: the week grid and 30-day strip score each
   window's equiv_tokens against the WEEKLY cap (pct_of_week), not the
   5-hour cap lvlOf above was built for. A single window is a small slice
   of a week by nature -- on the live store the worst window of the month
   never topped 24% -- so lvlOf's 45/75/95 edges would leave every one of
   these cells in the lowest band forever. WEEK_LVL_EDGES were read off that
   same live distribution: most ordinary windows sit under 6% of the week,
   6-12% is a genuinely heavy one, 12-20% a very heavy one, and only the
   single worst window of the month cleared 20%. Never applied to dry --
   that stays lvlOf/_score's 5-hour-cap claim. ==== */
var WEEK_LVL_EDGES = [6, 12, 20];
/* windows.WEEK_DAYS (7) x two half-day cells/day -- the account-wide week
   span the horizon strip's "THIS WEEK" marker highlights (PLAN-cap-and-chrome
   Part 2 #4), the same span the hero and week grid already use. */
var WEEK_HALVES = 14;
function lvlOfWeek(p) {
  if (p === null || p === undefined) return 0;
  return p >= WEEK_LVL_EDGES[2] ? 4 : p >= WEEK_LVL_EDGES[1] ? 3 : p >= WEEK_LVL_EDGES[0] ? 2 : p > 0 ? 1 : 0;
}
function fillColorWeek(p) { return LVL[lvlOfWeek(p)]; }
function inkOnWeek(p) { var l = lvlOfWeek(p); return (l === 2 || l === 3) ? "var(--color-bg)" : "var(--color-neutral-100)"; }
function shortModel(id) {
  if (!id) return null;
  var s = String(id).toLowerCase();
  if (s.indexOf("opus-4-8") >= 0) return "opus48";
  if (s.indexOf("opus") >= 0) return "opus";
  if (s.indexOf("fable") >= 0) return "fable";
  if (s.indexOf("sonnet") >= 0) return "sonnet";
  if (s.indexOf("haiku") >= 0) return "haiku";
  return s;
}
var MODEL_COLOR = {
  opus: "var(--m-opus)", fable: "var(--m-fable)", sonnet: "var(--m-sonnet)",
  haiku: "var(--m-haiku)", opus48: "var(--m-opus48)"
};
function modelColor(shortName) { return MODEL_COLOR[shortName] || "var(--color-neutral-500)"; }

var PX_LVL = ["var(--l0)", "var(--l1)", "var(--l2)", "var(--l3)", "var(--l4)"];
function pxLvl(p) { return p >= 95 ? 4 : p >= 75 ? 3 : p >= 45 ? 2 : p > 0 ? 1 : 0; }
function pxLeftLvl(pl) { return pl <= 10 ? 4 : pl <= 25 ? 3 : pl <= 55 ? 2 : 1; }
function pxMeter(pct, n, on, off, cellStyle) {
  var out = [];
  for (var i = 0; i < n; i++) {
    var bg = (i / n) * 100 < pct ? on : (off || "var(--l0)");
    out.push('<div style="flex:1;height:12px;background:' + bg + (cellStyle ? ";" + cellStyle : "") + '"></div>');
  }
  return out.join("");
}

/* ==== formatting ==== */
/* PLAN-dash-v2 6.4g #4: the payload carries `cwd` (a real absolute path)
   beside the sanitized store key (`-Users-raptor-Dev-clauaid`) -- the mock
   shows the folder's own basename as the name and a ~-abbreviated path
   beneath it, never the raw key. */
var _HOME_RE = /^\/(Users|home)\/[^/]+(\/.*)?$/;
function homeAbbrev(p) {
  if (!p) return p;
  var m = _HOME_RE.exec(p);
  return m ? ("~" + (m[2] || "")) : p;
}
function baseName(p) {
  if (!p) return null;
  var parts = String(p).replace(/\/+$/, "").split("/");
  return parts[parts.length - 1] || p;
}

function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function fmtTok(n) {
  if (n === null || n === undefined) return "\u2014";
  var a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(1) + "B";
  if (a >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (a >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return String(Math.round(n));
}
function fmtPct(p, digits) {
  if (p === null || p === undefined) return "\u2014";
  return p.toFixed(digits === undefined ? 0 : digits) + "%";
}
function fmtUsd(n) {
  if (n === null || n === undefined) return "\u2014";
  var neg = n < 0, a = Math.abs(n);
  var s = a >= 1000 ? "$" + Math.round(a).toLocaleString("en-US") : "$" + a.toFixed(2);
  return neg ? "-" + s : s;
}
/* 6.4g #5: the mock shows one short sentence, not the ~500-char structured
   fix_text (which stays behind the Copy-fix button, where it belongs). The
   detector's own `help` text is the closest single-sentence-ish field the
   payload carries; capped hard in case a future detector's help text runs
   long. */
function oneSentence(help) {
  if (!help) return "";
  var s = String(help);
  var dot = s.indexOf(". ");
  if (dot > 0 && dot < 160) s = s.slice(0, dot + 1);
  else if (s.length > 160) s = s.slice(0, 157) + "\u2026";
  return s.charAt(0).toUpperCase() + s.slice(1);
}
/* getDay() order, shared by the clock formatter and the fuse day ticks. */
var DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function fmtClock(iso) {
  if (!iso) return null;
  var d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  var days = DAY_NAMES;
  var hh
  var hh = String(d.getHours()).padStart(2, "0"), mm = String(d.getMinutes()).padStart(2, "0");
  return days[d.getDay()] + " " + hh + ":" + mm;
}
function agoText(iso) {
  if (!iso) return null;
  var ms = Date.now() - new Date(iso).getTime();
  if (!isFinite(ms) || ms < 0) return "just now";
  var s = Math.floor(ms / 1000);
  if (s < 60) return "just now";
  var m = Math.floor(s / 60);
  if (m < 60) return m + "m ago";
  var h = Math.floor(m / 60);
  return h + "h ago";
}

/* ==== state + fetch ==== */
var state = {
  scope: null,
  range: "day",
  copied: null,
  hover: null,
  windows: null, projects: null, findings: null, summary: null, usage: null, live: null, meta: null
};

function get(url) {
  return fetch(url, { credentials: "same-origin" }).then(function (r) {
    if (!r.ok) throw new Error(url + " " + r.status);
    return r.json();
  });
}
function scopedUrl(base, projectBase) {
  if (!state.scope) return base;
  return (projectBase || base) + (base.indexOf("?") >= 0 ? "&" : "?") + "project=" + encodeURIComponent(state.scope);
}

/* ==== header ==== */
function renderHeader() {
  var host = document.getElementById("cc-header");
  var tier = state.windows && state.windows.tier;
  var tierLabel = tier ? tier.label : null;
  var scopeLabel = state.scope ? state.scope : "all projects";
  var now = new Date();
  var hh = String(now.getHours()).padStart(2, "0"), mm = String(now.getMinutes()).padStart(2, "0");
  host.innerHTML =
    '<div style="display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:2px solid var(--line)">' +
    '<div style="display:flex;align-items:flex-end;gap:2px;height:14px">' +
    '<div style="width:4px;height:6px;background:var(--haiku)"></div>' +
    '<div style="width:4px;height:10px;background:var(--sonnet)"></div>' +
    '<div style="width:4px;height:14px;background:var(--opus)"></div>' +
    '<div style="width:4px;height:8px;background:var(--fable)"></div>' +
    '</div>' +
    '<span style="letter-spacing:0.14em;text-transform:uppercase">ccmetrics</span>' +
    '<span style="color:var(--dim)">' + (tierLabel ? esc(tierLabel.toLowerCase()) + " · " + esc(scopeLabel.toLowerCase()) : esc(scopeLabel.toLowerCase())) + '</span>' +
    '<span style="flex:1"></span>' +
    '<span style="color:var(--dim)">' + hh + ":" + mm + " · " + '<span id="cc-updated">updated just now</span><span style="animation:ccblink 1s steps(1,end) infinite"> _</span></span>';
}

/* ==== caps-unknown ribbon (6.3): not dismissible, tells the user how to
   unlock cap-relative mechanics. Absent once a cap exists. ==== */
function renderRibbon() {
  var host = document.getElementById("cc-ribbon");
  var w = state.windows;
  if (!w || w.caps_known) { host.innerHTML = ""; return; }
  var msg = w.hook_ran
    ? "Collecting \u2014 not enough usage yet to estimate a cap."
    : "Caps are unknown until Claude Code\u2019s /usage panel has been opened (or the statusline hook is installed). Until then, fill and reset times show; percentages and \u201cran dry\u201d do not.";
  host.innerHTML =
    '<div class="cc-ribbon" style="margin-top:14px">' +
    '<span style="width:7px;height:7px;border-radius:4px;background:var(--color-accent-500);flex:0 0 auto"></span>' +
    '<span>' + esc(msg) + '</span>' +
    '</div>';
}

/* ==== hero: the fuse + three-limits headroom ====
   6.3 caps-unknown: fuse fills on share-of-week-so-far instead of used_pct;
   verdict swaps to the two defined sentences; wick/runs-out become em dash. */
function heroFuse() {
  var w = state.windows, hero = w.hero, capsKnown = w.caps_known;
  var usedPct, clockPct, source;
  var clockKnown = hero.clock_pct !== null && hero.clock_pct !== undefined;
  if (capsKnown && hero.used_pct !== null && hero.clock_pct !== null) {
    usedPct = hero.used_pct; clockPct = hero.clock_pct; source = "cap";
  } else if (hero.clock_pct !== null) {
    /* off: fill on share-of-week-so-far, not a cap-relative percentage */
    usedPct = hero.clock_pct; clockPct = hero.clock_pct; source = "clock";
  } else {
    usedPct = 0; clockPct = 0; source = "none";
  }
  var behind = capsKnown ? hero.behind : null;
  /* How much of the WEEKLY CAP is left, not the clock. Percent of the cap
     used, never percent of the week elapsed -- the clock is irrelevant to
     whether the cap itself is nearly spent. Deliberately NOT the local
     `usedPct` above: usedPct falls back to clockPct when no cap is known
     (lines 378-385), so branching on it would scream "week nearly gone"
     every time caps are unknown, cap or no cap. Both the face and the
     verdict below gate on `capsKnown && hero.used_pct` directly instead. */
  var pctLeft = (capsKnown && hero.used_pct !== null && hero.used_pct !== undefined)
    ? (100 - hero.used_pct) : null;
  /* Verdict severity scale (PLAN-cap-and-chrome Part 2 #3): three stops, not
     two -- single-digit percentages read as urgent on their own, not folded
     into the same mild "getting tight" wording as the teens. <=15% left is
     worth a glance; under 10% ("single digits") is worth acting on; <=5% is
     the strongest wording, effectively out. */
  var nearlyGone = pctLeft !== null && pctLeft <= 5;    /* under ~5% of the cap left */
  var singleDigits = pctLeft !== null && pctLeft < 10;  /* under 10% -- urgent, not just tight */
  var gettingTight = pctLeft !== null && pctLeft <= 15; /* under ~15% left */
  /* Calm -> alarmed emoji, gated the same way as the verdict below (cap
     percent, not the clock-fallback usedPct) so a capless Sunday never
     shows an alarmed face it hasn't earned. 5 stops read as a gradient
     rather than a binary flip, mirrored off the same pctLeft thresholds:
       unknown        relaxed        -- nothing to read into it yet
       >15% left      mildly aware   -- still fine, just no longer empty
       <=15% left     watching it    -- worth a glance, not yet urgent
       <=10% left     stressed       -- the cap is nearly spent
       <=5%  left     alarmed (🥵) -- effectively out; requested for the hot end */
  var face = "(・_・)";
  if (pctLeft !== null) {
    if (pctLeft <= 5) {
      face = "(>_<;)";
    } else if (pctLeft <= 10) {
      face = "(•_•;)";
    } else if (pctLeft <= 15) {
      face = "(•_•)";
    } else {
      face = "(•‿•)";
    }
  }
  var verdict, verdictSub;
  /* The percentage only moves when /usage is opened. Once the reading is
     hours old the week has burned on without it, so a confident verdict off
     that number would be a guess wearing a fact's clothes: say the age and
     let the figures below stand as "as of then". */
  var readAge = hero.reading_age_hours;
  var stale = readAge !== null && readAge !== undefined && readAge >= 6;
  /* Absolute exhaustion is checked before any clock-relative branch: being
     "ahead of" or "behind" the clock is meaningless once the cap itself is
     nearly spent -- 2% left is a crisis at any pace, including a slow one.
     It still yields to `stale`: usage only ever rises inside a window, so
     a stale 98% reading is a floor worth naming, but the reading's age is
     the more important fact to lead with when both are true at once. */
  if (stale) {
    verdict = "This reading is " + Math.round(readAge) + " hours old.";
    verdictSub = "The week kept burning since. Open /usage in Claude Code for a fresh one — everything below is as of then.";
  } else if (!capsKnown) {
    verdict = w.hook_ran ? "Collecting — not enough usage yet" : "Caps are unknown until Claude Code’s /usage panel has been opened.";
    verdictSub = "Once a cap survives, the fuse, wick and runs-out time light up here with no other change.";
  } else if (nearlyGone) {
    verdict = "The week is almost gone.";
    verdictSub = "Only " + pctLeft.toFixed(0) + "% of the week is left, no matter the pace.";
  } else if (singleDigits) {
    verdict = "Single digits left — the week is nearly spent.";
    verdictSub = "Only " + pctLeft.toFixed(0) + "% of the week is left. Not the week to relax the pace.";
  } else if (gettingTight) {
    verdict = "Getting tight — most of the week is spent.";
    verdictSub = pctLeft.toFixed(0) + "% of the week is left.";
  } else if (behind !== null && behind > 6) {
    verdict = "Burning faster than the week refills.";
    verdictSub = "The flame is " + Math.round(behind) + " points ahead of the clock.";
  } else if (behind !== null && behind > 0) {
    verdict = "A little ahead of the clock.";
    verdictSub = behind.toFixed(0) + " points ahead \u2014 comfortable, worth a glance.";
  } else if (behind !== null) {
    verdict = "Comfortably inside the week.";
    verdictSub = "The flame is " + Math.abs(Math.round(behind)) + " points behind the clock.";
  } else {
    verdict = "Tracking the week.";
    verdictSub = "No reset time on the weekly reading yet, so there is no clock to compare against.";
  }
  var burnt = capsKnown ? hero.burnt_equiv : null;
  var left = capsKnown ? hero.left_equiv : null;
  var wick = (left === null || left === undefined) ? "\u2014" : fmtTok(left);
  var burntLine = (burnt === null || burnt === undefined)
    ? fmtTok(null)
    : fmtTok(burnt) + ' <span style="font-size:11px;color:var(--color-neutral-600)">' + fmtPct(usedPct) + '</span>';
  /* 6.4g #2: runs_out_at can land after resets_at -- the week holds at the
     current burn rate. The backend already keeps early_hours strictly
     positive for that case (null instead), so the frontend need only pick
     the right copy, never invent a "late" figure of its own. */
  var DAY_UP = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  var runsOut, earlyBadge = "";
  if (!capsKnown) {
    runsOut = "—";
  } else if (hero.runs_out_at && hero.early_hours !== null && hero.early_hours !== undefined) {
    var runsOutDate = new Date(hero.runs_out_at);
    runsOut = DAY_UP[runsOutDate.getDay()] + " " + fmtClock(hero.runs_out_at);
    var eh = Math.round(hero.early_hours);
    earlyBadge = ' <span class="px-faint">' + eh + "h early</span>";
  } else if (hero.resets_at) {
    runsOut = "Holds";
  } else {
    runsOut = "—";
  }
  var resets = hero.resets_at ? fmtClock(hero.resets_at) : "—";
  var burnPerHr = hero.burn_equiv_per_hour;
  var burnUsd = hero.burn_usd_per_hour;
  /* The weekly window spans reset-minus-7-days to reset, so column i starts
     on weekday (resetDay + i) % 7; the row's right edge is the reset
     instant. With no reset instant there is no window to divide, so the
     row shows a single dash rather than a guessed weekday. */
  var fuseDayRow = "";
  if (hero.resets_at) {
    var startDay = new Date(hero.resets_at).getDay();
    var cols = [];
    for (var di = 0; di < 7; di++) {
      cols.push('<div style="flex:1;border-left:2px solid var(--line);padding-left:5px">' + DAY_UP[(startDay + di) % 7] + "</div>");
    }
    fuseDayRow = cols.join("");
  } else {
    fuseDayRow = '<div style="flex:1;border-left:2px solid var(--line);padding-left:5px">—</div>';
  }

  /* 40 discrete cells stepping green -> red as the fill rises; caps-unknown
     fills token-scaled neutral instead of the ramp, never the colour ramp. */
  var fuseCells = "";
  for (var ci = 0; ci < 40; ci++) {
    var cellAt = (ci / 40) * 100;
    var cellBg;
    if (cellAt < usedPct) {
      cellBg = source === "cap"
        ? PX_LVL[pxLvl(Math.round((cellAt / Math.max(usedPct, 1)) * 100))]
        : "var(--line)";
    } else {
      cellBg = "var(--l0)";
    }
    fuseCells += '<div style="flex:1;height:22px;background:' + cellBg + '"></div>';
  }

  var clockMarker = "";
  if (clockKnown) {
    clockMarker =
      '<div style="position:absolute;left:' + clockPct + '%;top:-30px;margin-left:-6px;transform:translateX(-100%);white-space:nowrap;color:var(--dim);z-index:6">clock &gt;</div>' +
      '<div style="position:absolute;left:' + clockPct + '%;top:-22px;width:2px;height:56px;background:var(--dim);z-index:6"></div>';
  }

  /* Flame is only rendered against a known cap -- a capless page has no
     usedPct worth animating a fuse burn at. */
  var flame = "";
  if (source === "cap") {
    flame =
      '<div style="position:absolute;left:' + usedPct + '%;top:22px;transform:translate(-50%,-100%);width:14px;height:20px;pointer-events:none;z-index:4">' +
      '<div style="position:absolute;left:0;bottom:0;width:14px;height:20px;transform:scale(2.4);transform-origin:bottom center">' +

function heroHeadroom() {
  var w = state.windows, capsKnown = w.caps_known;
  var rows = (w.headroom || []).map(function (hr) {
    var dot = hr.model
      ? '<span style="width:6px;height:6px;background:' + modelColor(shortModel(hr.model)) + '"></span>'
      : "";
    var left = capsKnown && hr.left_pct !== null && hr.left_pct !== undefined ? fmtPct(hr.left_pct) : "—";
    var meterColor = capsKnown ? PX_LVL[pxLeftLvl(hr.left_pct)] : "var(--line)";
    var rowColor = capsKnown ? meterColor : "var(--dim)";
    var usedW = hr.used_pct !== null && hr.used_pct !== undefined ? hr.used_pct : 0;
    var leftFill = capsKnown ? hr.left_pct : 100 - usedW;
    return '<div>' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:6px">' +
      '<span style="display:flex;align-items:center;gap:7px;color:var(--dim);text-transform:uppercase">' + dot + esc(hr.short_label || hr.label) + "</span>" +
      '<span style="font-size:15px;color:' + rowColor + '">' + left + "</span>" +
      "</div>" +
      '<div style="display:flex;gap:2px">' + pxMeter(leftFill, 16, meterColor) + "</div>" +
      '<div class="px-faint" style="margin-top:5px;text-transform:uppercase">' + esc(hr.note) + "</div>" +
      "</div>";
  }).join("");
  var body = rows;
  if (!body) {
    body = w.setup_cmd
      ? '<div class="px-faint">QUOTA OFF · ' + esc(w.setup_cmd) + "</div>"
      : '<div class="px-faint">NO USAGE WINDOWS REPORTED YET.</div>';
  }
  var advice = "";
  if (capsKnown) {
    var candidates = (w.headroom || []).filter(function (hr) {
      return hr.model && hr.resets_at && typeof hr.left_pct === "number" && hr.left_pct <= 25;
    });
    if (candidates.length) {
      var pick = candidates.reduce(function (a, b) { return b.left_pct < a.left_pct ? b : a; });
      var day = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"][new Date(pick.resets_at).getDay()];
      advice = '<div style="margin-top:18px;padding:11px 13px;border:2px solid var(--line);color:var(--ink)">&gt; PUT <span style="color:' + modelColor(shortModel(pick.model)) + '">' + esc(shortModel(pick.model).toUpperCase()) + '</span> DOWN UNTIL ' + day + '</div>';
    } else {
      advice = '<div style="margin-top:18px;padding:11px 13px;border:2px solid var(--line);color:var(--dim)">&gt; NOTHING TO PUT DOWN — EVERY LIMIT HAS ROOM</div>';
    }
  }
  return '<div class="px-panel">' +
    '<div class="px-label">LIMITS LEFT</div>' +
    '<div style="display:flex;flex-direction:column;gap:16px;margin-top:14px">' + body + "</div>" +
    advice +
    "</div>";
}

/* ==== live strip ====
   6.2: idle is /api/live returning {status: "no live session", ...} with
   none of the tile fields -- dashes in every tile, "no session" in the label
   slot. */
function renderLive() {
  var host = document.getElementById("cc-live");
  var live = state.live;
  var w = state.windows;
  var cur = w && w.current_block;
  var isLive = live && live.status === "live";

  function tile(label, value, sub) {
    return '<div style="padding:0 22px">' +
      '<div style="font-size:11px;color:var(--color-neutral-600)">' + esc(label) + "</div>" +
      '<div style="font-family:var(--font-heading);font-size:15px;margin-top:2px">' + value +
      (sub ? ' <span style="font-size:11px;color:var(--color-neutral-600)">' + sub + "</span>" : "") +
      "</div></div>";
  }
  var divider = '<div style="width:1px;height:38px;background:var(--color-divider)"></div>';

  var labelText, sublabel, burnRate, burnSub, quotaRate, quotaSub, blockVal, blockSub, ctxVal, ctxSub, cacheVal, sessVal;
  if (isLive) {
    labelText = live.project || "session";
    sublabel = (shortModel(live.model) || "?") + " \u00b7 " + (live.turns || 0) + " turns \u00b7 " + agoText(live.last_turn_at);
    var burn = live.burn || {};
    burnRate = burn.equiv_tokens_per_hour ? fmtTok(burn.equiv_tokens_per_hour) + " tok/hr" : "\u2014";
    burnSub = burn.floor_usd_per_hour !== null && burn.floor_usd_per_hour !== undefined ? "\u00b7 " + fmtUsd(burn.floor_usd_per_hour) + "/hr" : "";
    var cap5 = w && w.caps_known ? (w.caps["session"] || w.caps["five_hour"] || {}).cap_equiv : null;
    if (w.caps_known && cap5 && burn.equiv_tokens_per_hour) {
      quotaRate = fmtPct(burn.equiv_tokens_per_hour / cap5 * 100) + "/hr";
      quotaSub = cur && cur.lands_at_pct !== null ? "\u00b7 block lands at " + fmtPct(cur.lands_at_pct) : "";
    } else { quotaRate = "\u2014"; quotaSub = ""; }
    blockVal = cur ? fmtTok(cur.equiv_tokens) : "\u2014";
    blockSub = cur && cap5 ? "of \u2248" + fmtTok(cap5) + " \u00b7 " + cur.turns + " turns" : (cur ? cur.turns + " turns" : "");
    var ctx = live.context || {};
    ctxVal = ctx.pct !== null && ctx.pct !== undefined ? fmtPct(ctx.pct) : "\u2014";
    ctxSub = ctx.window ? "of " + fmtTok(ctx.window) : "";
    cacheVal = live.cache_hit !== null && live.cache_hit !== undefined ? fmtPct(live.cache_hit * 100) : "\u2014";
    sessVal = live.floor_priced && live.floor_usd !== null ? fmtUsd(live.floor_usd) : "\u2014";
  } else {
    labelText = "no session";
    sublabel = (live && live.reason) ? live.reason : "";
    burnRate = quotaRate = blockVal = ctxVal = cacheVal = sessVal = "\u2014";
    burnSub = quotaSub = blockSub = ctxSub = "";
  }

  host.innerHTML =
    '<div style="display:flex;align-items:center;gap:0;margin-top:14px;padding:14px 24px;background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);flex-wrap:wrap">' +
    '<div style="display:flex;align-items:center;gap:9px;padding-right:22px">' +
    '<span class="cc-live-dot" style="width:7px;height:7px;border-radius:4px;background:' + (isLive ? "var(--color-accent)" : "var(--color-neutral-700)") + ';' + (isLive ? "animation:ccpulse 1.8s ease-in-out infinite" : "") + '"></span>' +
    '<span style="font-family:var(--font-heading);font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:var(--color-accent-300)">Live</span>' +
    '<span style="font-size:12.5px;color:var(--color-neutral-300)">' + esc(labelText) + "</span>" +
    '<span style="font-size:12px;color:var(--color-neutral-600)">' + esc(sublabel) + "</span>" +
    "</div>" + divider +
    tile("Burn rate", burnRate, burnSub) + divider +
    tile("Same rate, in quota", quotaRate, quotaSub) + divider +
    tile("This block", blockVal, blockSub) + divider +
    tile("Context", ctxVal, ctxSub) + divider +
    tile("From cache", cacheVal, "") + divider +
    '<div style="padding:0 0 0 22px"><div style="font-size:11px;color:var(--color-neutral-600)">Session so far</div><div style="font-family:var(--font-heading);font-size:15px;margin-top:2px">' + sessVal + "</div></div>" +
    "</div>";
}

/* ==== 30-day horizon, 60 half-day cells (windows.horizon_cells: 2 x 30 = 60,
   matching the mock\u2019s own actual cell count, PLAN-dash-v2 6.2). 6.3:
   caps unknown -- fill on equiv_tokens scaled to the largest cell in range,
   dry forced false, legend/caption swap to a no-dry-claim variant. ==== */
function renderHorizon() {
  var host = document.getElementById("cc-horizon");
  var w = state.windows;
  if (!w) { host.innerHTML = ""; return; }
  var cells = w.horizon || [];
  var capsKnown = w.caps_known;
  var maxTok = 0;
  cells.forEach(function (c) { if (c.equiv_tokens > maxTok) maxTok = c.equiv_tokens; });

  var cellsHtml = cells.map(function (c) {
    var bg;
    if (capsKnown && c.pct_of_week !== null && c.pct_of_week !== undefined) {
      bg = PX_LVL[pxLvl(c.pct_of_week)];
    } else {
      var frac = maxTok > 0 ? c.equiv_tokens / maxTok : 0;
      bg = frac > 0.5 ? "var(--line)" : "var(--l0)";
    }
    return '<div style="flex:1;height:44px;background:' + bg + '"></div>';
  }).join("");

  var dryHeader = capsKnown
    ? '<span style="color:var(--l4)">' + (w.dry_count_month ?? "?") + " RAN DRY</span>"
    : '<span style="color:var(--dim)">CAP UNKNOWN — NO DRY COUNT</span>';

  var axisHtml;
  if (cells.length > WEEK_HALVES) {
    var first = cells[0] || {};
    axisHtml = '<div style="display:flex;margin-top:8px">' +
      '<div style="flex:' + (cells.length - WEEK_HALVES) + ';border-top:2px solid var(--line);padding-top:5px" class="px-faint">' + esc(first.label || first.date) + "</div>" +
      '<div style="flex:' + WEEK_HALVES + ';border-top:2px solid var(--dim);padding-top:5px;padding-left:6px;color:var(--dim)">THIS WEEK</div>' +
      "</div>";
  } else {
    var only = cells[0] || {};
    axisHtml = '<div style="display:flex;margin-top:8px">' +
      '<div style="flex:1;border-top:2px solid var(--line);padding-top:5px" class="px-faint">' + esc(only.label || only.date) + "</div>" +
      "</div>";
  }

  var caption;
  if (capsKnown) {
    var dryCells = cells.filter(function (c) { return c.dry; });
    var eveningDry = dryCells.filter(function (c) { return c.evening; }).length;
    if (dryCells.length > 0) {
      caption = eveningDry === 0
        ? "NONE OF THE " + dryCells.length + " DRY WINDOWS WERE EVENING BLOCKS"
        : eveningDry + " OF THE " + dryCells.length + " DRY WINDOWS WERE EVENING BLOCKS — A TIME OF DAY, NOT BAD LUCK";
    } else {
      caption = "NO WINDOW RAN DRY THIS MONTH";
    }
  } else {
    caption = "FILL IS RELATIVE TO THE HEAVIEST WINDOW IN RANGE — CAPS ARE UNKNOWN UNTIL A READING EXISTS.";
  }

  host.innerHTML =
    '<div class="px-panel" style="margin-top:20px">' +
    '<div style="display:flex;justify-content:space-between;margin-bottom:14px">' +
    '<span class="px-label">MONTH · ' + cells.length + ' WINDOWS</span>' +
    dryHeader +
    "</div>" +
    '<div style="display:flex;gap:3px">' + cellsHtml + "</div>" +
    axisHtml +
    '<div style="margin-top:14px;color:var(--dim)">' + esc(caption) + "</div>" +
    "</div>";
}

/* ==== Recoverable ledger (6.4b: ship exactly the mock\u2019s ledger -- three
   leak rows with a payoff bar; the waterfall/treemap/payoff-scatter
   alternatives are DECIDED not built this pass). ==== */
function renderRecoverable() {
  var host = document.getElementById("cc-recoverable");
  var f = state.findings;
  var w = state.windows;
  var all = (f && f.findings) || [];
  if (!all.length) {
    host.innerHTML = '<div class="px-panel px-faint" style="margin-top:20px">NO RECOVERABLE FINDINGS YET.</div>';
    return;
  }
  var total = all.reduce(function (a, x) { return a + (x.tokens_saved || 0); }, 0);
  var capsKnown = w && w.caps_known;
  var weeklyCap = capsKnown ? ((w.caps["weekly_all"] || w.caps["seven_day"] || {}).cap_equiv) : null;
  var top = all.slice(0, 3);

  var hero = w && w.hero;
  var usedPct = hero && typeof hero.used_pct === "number" ? hero.used_pct : null;
  var projection = "";
  if (capsKnown && weeklyCap && usedPct !== null) {
    var savedWeekly = top.reduce(function (a, x) { return a + (x.tokens_saved || 0); }, 0) * (7 / 30);
    var afterPct = Math.max(0, usedPct - (savedWeekly / weeklyCap) * 100);
    var afterColor = PX_LVL[pxLeftLvl(100 - afterPct)];
    var label = top.length === 3 ? "FIX ALL THREE: " : "FIX THE TOP " + top.length + ": ";
    projection = label + fmtPct(usedPct) + ' <span style="color:var(--ink)">&gt;</span> ' +
      '<span style="color:' + afterColor + '">' + fmtPct(afterPct) + "</span>" +
      '<span style="display:flex;gap:2px">' + pxMeter(afterPct, 16, afterColor, null, "width:7px;flex:none;height:10px") + "</span>" +
      " · ";
  }

  var rows = top.map(function (item, i) {
    var pct = total > 0 ? Math.round((item.tokens_saved || 0) / total * 100) : 0;
    var lvl = PX_LVL[pxLvl(pct)];
    var copyId = "cc-copy-" + i;
    return '<div style="display:grid;grid-template-columns:24px minmax(180px,2fr) minmax(120px,1.4fr) minmax(90px,0.9fr) 92px;gap:0 16px;align-items:center;border:2px solid var(--line);padding:12px 14px">' +
      '<div class="px-faint">' + String(i + 1).padStart(2, "0") + "</div>" +
      "<div>" +
      '<div style="font-size:13px;text-transform:uppercase">' + esc(item.name) +
      (item.project ? " · " + esc(baseName(item.cwd) || item.project) : "") + "</div>" +
      '<div style="margin-top:4px;color:var(--dim)">' + esc(oneSentence(item.help)) + "</div>" +
      '<div style="margin-top:5px;color:#f4c7ad">&gt; ' + esc(item.fix_text || "") + "</div>" +
      "</div>" +
      '<div style="display:flex;gap:2px">' + pxMeter(pct, 12, lvl) + "</div>" +
      '<div style="font-size:13px;color:' + lvl + '">' + fmtTok(item.tokens_saved) + "</div>" +
      '<div id="' + copyId + '" data-fix="' + esc(item.fix_text || "") + '" style="text-align:center;border:2px solid var(--line);padding:6px 0;cursor:pointer">COPY</div>' +
      "</div>";
  }).join("");

  host.innerHTML =
    '<div class="px-panel" style="margin-top:20px">' +
    '<div style="display:flex;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">' +
    '<span class="px-label">RECOVERABLE · ' + fmtTok(total) + ' TOKENS</span>' +
    '<span style="display:flex;align-items:center;gap:10px;color:var(--dim);flex-wrap:wrap">' + projection + all.length + ' FINDINGS</span>' +
    "</div>" +
    '<div style="display:flex;flex-direction:column;gap:10px">' + rows + "</div>" +
    "</div>";

  top.forEach(function (item, i) {
    var el = document.getElementById("cc-copy-" + i);
    if (!el) return;
    el.addEventListener("click", function () {
      var text = el.getAttribute("data-fix") || "";
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(function () {});
      el.textContent = "COPIED";
      setTimeout(function () { el.textContent = "COPY"; }, 1600);
    });
  });
}

/* ==== Projects: "which projects drain the window" ====
   6.4: guard the empty-store crash (mock does projects[0] unconditionally). */
function renderProjects() {
  var host = document.getElementById("cc-projects");
  var p = state.projects;
  var rows = (p && p.rows) || [];
  if (!rows.length) {
    host.innerHTML = '<div style="margin-top:20px;padding:26px 28px 22px;background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);font-size:12.5px;color:var(--color-neutral-500)">No projects ingested yet.</div>';
    return;
  }
  var total = rows.reduce(function (a, r) { return a + (r.equiv || 0); }, 0);
  var lead = rows[0];
  var leadShare = total > 0 ? Math.round((lead.equiv || 0) / total * 100) : 0;
  var fractionWord = leadShare >= 70 ? "nearly three quarters" : leadShare >= 62 ? "two thirds" : leadShare >= 45 ? "about half" : leadShare + "%";
  var leadLabel = lead.ephemeral ? "test \u0026 scratch runs" : (lead.project || "?");
  var projLead = rows.length > 1
    ? esc(leadLabel) + " alone is " + fractionWord + " of the window \u2014 every other project together fits in the rest."
    : "";

  var rowsHtml = rows.map(function (r, i) {
    var sharePct = total > 0 ? Math.round((r.equiv || 0) / total * 100) : 0;
    var barPct = Math.max(2, sharePct);
    var name = r.ephemeral ? "everything else" : (baseName(r.cwd) || r.project || "?");
    var pathLabel = r.ephemeral ? (r.eph_count + " temp folders") : (homeAbbrev(r.cwd) || r.project || "");
    var leak = r.top_leak;
    var leakHtml;
    if (leak) {
      /* mock 6.4c: delta_pct is None for a project with no previous window
         to compare against -- that renders as the mock\u2019s own dash, never
         "\u25b2 None". A non-positive delta (flat or down) reads the same way:
         the mock only ever draws an up-arrow or a dash. */
      var deltaText, deltaColor;
      if (r.delta_pct === null || r.delta_pct === undefined || r.delta_pct <= 0) {
        deltaText = "\u2014"; deltaColor = "var(--color-neutral-600)";
      } else if (r.delta_pct >= 500) {
        // 6.4g #6: a real +12951% is not a meaningful number to a reader --
        // the mock's own copy for this case drops the digits entirely.
        deltaText = "\u25b2 much higher"; deltaColor = "var(--lvl-3)";
      } else {
        deltaText = "\u25b2 +" + Math.round(r.delta_pct) + "%"; deltaColor = "var(--lvl-3)";
      }
      leakHtml = '<div style="font-size:12.5px;color:var(--color-neutral-300)">' + esc(leak.name) + "</div>" +
        '<div style="font-size:10.5px;color:' + deltaColor + '">' + fmtTok(leak.tokens_saved) + " saveable \u00b7 " + deltaText + "</div>";
    } else {
      leakHtml = '<div style="font-size:12.5px;color:var(--color-neutral-600)">\u2014</div>';
    }
    var clickable = !r.ephemeral && r.project;
    return '<div data-project="' + esc(r.project || "") + '" class="cc-hover-projrow cc-proj-row" style="display:grid;grid-template-columns:24px minmax(120px,1.4fr) minmax(150px,2fr) minmax(64px,0.7fr) minmax(48px,0.5fr) minmax(120px,1.8fr);gap:0 16px;align-items:center;padding:11px 12px;border-radius:var(--radius-sm);border-bottom:1px solid var(--color-neutral-900);cursor:' + (clickable ? "pointer" : "default") + '">' +
      '<div style="font-family:var(--font-heading);font-size:11px;color:var(--color-neutral-600)">' + String(i + 1).padStart(2, "0") + "</div>" +
      "<div>" +
      '<div style="font-size:13.5px;color:var(--color-neutral-200)">' + esc(name) + "</div>" +
      '<div class="cc-mono" style="font-size:10.5px;color:var(--color-neutral-600)">' + esc(pathLabel) + "</div>" +
      "</div>" +
      '<div style="display:flex;align-items:center;gap:12px">' +
      '<span style="width:34px;font-family:var(--font-heading);font-size:14px;color:' + (sharePct >= 45 ? fillColor(sharePct) : "var(--color-neutral-300)") + '">' + sharePct + "%</span>" +
      '<span style="flex:1;height:7px;border-radius:4px;background:var(--color-neutral-900);display:block"><span style="display:block;height:7px;border-radius:4px;width:' + barPct + '%;background:' + fillColor(sharePct) + '"></span></span>' +
      "</div>" +
      '<div style="text-align:right;font-size:13px;color:var(--color-neutral-300)">' + fmtTok(r.equiv) + "</div>" +
      '<div style="text-align:right;font-size:12.5px;color:var(--color-neutral-500)">' + (r.cache_hit !== null && r.cache_hit !== undefined ? fmtPct(r.cache_hit * 100) : "\u2014") + "</div>" +
      "<div>" + leakHtml + "</div>" +
      "</div>";
  }).join("");

  host.innerHTML =
    '<div style="margin-top:20px;padding:26px 28px 22px;background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)">' +
    '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px;flex-wrap:wrap">' +
    "<div>" +
    '<div style="font-family:var(--font-heading);font-size:12px;letter-spacing:0.09em;text-transform:uppercase;color:var(--color-neutral-500);margin-bottom:6px">Which projects drain the window</div>' +
    '<div style="font-size:12.5px;color:var(--color-neutral-500)">' + (p.window_days || 30) + " days \u00b7 " + fmtTok(total) + " tokens. Click a row to scope the whole page to it.</div>" +
    "</div>" +
    '<div style="font-size:12.5px;color:var(--color-neutral-400);text-align:right;max-width:420px">' + projLead + "</div>" +
    "</div>" +
    '<div style="display:grid;grid-template-columns:24px minmax(120px,1.4fr) minmax(150px,2fr) minmax(64px,0.7fr) minmax(48px,0.5fr) minmax(120px,1.8fr);gap:0 16px;align-items:center;padding:0 12px 8px;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-600);border-bottom:1px solid var(--color-divider)">' +
    '<div></div><div>Project</div><div>Share of the month</div><div style="text-align:right">Tokens</div><div style="text-align:right">Cache</div><div>Biggest leak</div></div>' +
    '<div style="display:flex;flex-direction:column">' + rowsHtml + "</div>" +
    "</div>";

  Array.prototype.forEach.call(host.querySelectorAll(".cc-proj-row"), function (el) {
    var key = el.getAttribute("data-project");
    if (!key) return;
    el.addEventListener("click", function () {
      state.scope = (state.scope === key) ? null : key;
      boot();
    });
  });
}

/* ==== Value the plan absorbed (day/week/total) + What the quota counted.
   Decision 8: money is a band -- midpoint big, [lo,hi] in the caption, "not
   a bill" prominent. The line/area colour uses the same fillColor scale the
   mock\u2019s own code (not its comment) applies, simplified to one colour
   per series (its average level) rather than a per-point gradient. ==== */
function dayValue(d) {
  var lo = (d.floor_usd || 0) + (d.est_lo || 0);
  var hi = (d.floor_usd || 0) + (d.est_hi || 0);
  return { mid: (lo + hi) / 2, lo: lo, hi: hi };
}

function dollarSeries(daily) {
  if (state.range === "week") {
    var out = [];
    for (var i = 0; i < daily.length; i += 6) {
      var chunk = daily.slice(i, i + 6);
      var mid = 0, lo = 0, hi = 0;
      chunk.forEach(function (d) { var v = dayValue(d); mid += v.mid; lo += v.lo; hi += v.hi; });
      var label = chunk.length > 1 ? chunk[0].date.slice(5) + "\u2013" + chunk[chunk.length - 1].date.slice(5) : chunk[0].date;
      out.push({ label: label, v: mid, lo: lo, hi: hi, sub: chunk.length + " days" });
    }
    return out;
  }
  if (state.range === "total") {
    var run = 0, runLo = 0, runHi = 0;
    return daily.map(function (d) {
      var v = dayValue(d); run += v.mid; runLo += v.lo; runHi += v.hi;
      return { label: d.date, v: run, lo: runLo, hi: runHi, sub: "running total" };
    });
  }
  return daily.map(function (d) {
    var v = dayValue(d);
    return { label: d.date, v: v.mid, lo: v.lo, hi: v.hi, sub: fmtTok(d.equiv || 0) + " tokens" };
  });
}

function renderDollars() {
  var host = document.getElementById("cc-dollars");
  var s = state.summary;
  if (!s) { host.innerHTML = ""; return; }
  var daily = s.series || [];
  var series = dollarSeries(daily);
  var n = series.length;
  var peak = 0;
  series.forEach(function (x) { if (x.v > peak) peak = x.v; });
  var step = peak > 3000 ? 1000 : peak > 900 ? 500 : 100;
  var axisMax = Math.max(step, Math.ceil(peak / step) * step);
  var VW = 1000, VH = 110;
  function px(i) { return n <= 1 ? VW / 2 : (i / (n - 1)) * VW; }
  function py(v) { return VH - (v / axisMax) * (VH - 5); }
  var linePts = series.map(function (x, i) { return px(i).toFixed(1) + "," + py(x.v).toFixed(1); }).join(" ");
  var areaPts = "0," + VH + " " + linePts + " " + VW + "," + VH;
  /* mock 6.2/6.4c: per-point heat gradient, not one flat colour -- each day's
     own stop is fillColor(that day's share of the axis). */
  var lineStops = series.map(function (x, i) {
    var o = (n === 1 ? 50 : (i / (n - 1)) * 100).toFixed(2) + "%";
    return { o: o, c: fillColor(axisMax > 0 ? Math.round(x.v / axisMax * 100) : 0) };
  });
  var heatStops = lineStops.map(function (st) { return '<stop offset="' + st.o + '" stop-color="' + st.c + '"></stop>'; }).join("");
  var fillStops = lineStops.map(function (st) { return '<stop offset="' + st.o + '" stop-color="' + st.c + '" stop-opacity="0.16"></stop>'; }).join("");
  /* "spike" days: no fixed demo threshold survives real data, so a day is
     marked when it clears 1.5x the series mean -- same spirit as the mock\u2019s
     per-range constant, applied to whatever range is on screen. */
  var seriesMean = n > 0 ? series.reduce(function (a, x) { return a + x.v; }, 0) / n : 0;
  var spike = seriesMean > 0 ? seriesMean * 1.5 : Infinity;
  var marks = series
    .map(function (x, i) { return { x: x, i: i }; })
    .filter(function (o) { return o.x.v >= spike; })
    .slice(0, 6)
    .map(function (o) {
      return { x: px(o.i).toFixed(1), y: py(o.x.v).toFixed(1), color: fillColor(axisMax > 0 ? Math.round(o.x.v / axisMax * 100) : 0) };
    });
  var marksHtml = marks.map(function (m) {
    return '<circle cx="' + m.x + '" cy="' + m.y + '" r="3" fill="var(--color-bg)" stroke="' + m.color + '" stroke-width="1.6" vector-effect="non-scaling-stroke"></circle>';
  }).join("");

  var nTicks = Math.max(1, Math.round(axisMax / step));
  var ticksHtml = "";
  for (var t = nTicks; t >= 0; t--) {
    var top = (100 - (t / nTicks) * 100) + "%";
    ticksHtml += '<div style="position:absolute;left:46px;right:0;top:' + top + ';height:1px;background:' + (t === 0 ? "var(--color-neutral-800)" : "var(--color-neutral-900)") + '"></div>';
    ticksHtml += '<div style="position:absolute;left:0;width:38px;top:' + top + ';margin-top:-8px;text-align:right;font-size:10.5px;color:var(--color-neutral-600)">' + (t === 0 ? "$0" : fmtUsd(t * step)) + "</div>";
  }
  var barsAxis = series.map(function (x, i) {
    var label = state.range === "day" ? (i % 5 === 0 ? String(i + 1) : "") : x.label;
    return '<div data-i="' + i + '" class="cc-dollar-bar" style="flex:1;text-align:center;font-size:10px;color:var(--color-neutral-600);white-space:nowrap;cursor:default">' + esc(label) + "</div>";
  }).join("");
  var hv = state.hover;
  var h = (hv !== null && series[hv]) ? series[hv] : null;
  var readoutLabel = h ? esc(h.label) + " \u00b7 " + fmtUsd(h.v) : (state.range === "total" && n ? fmtUsd(series[n - 1].v) + " total" : "Hover a day");
  var readoutDetail = h ? esc(h.sub) : "";

  var segBtn = function (key, text) {
    var active = state.range === key;
    return '<div data-range="' + key + '" class="cc-range-btn" style="padding:5px 12px;border-radius:3px;font-size:11.5px;cursor:pointer;color:' +
      (active ? "var(--color-accent-200)" : "var(--color-neutral-500)") + ";background:" + (active ? "var(--color-accent-900)" : "transparent") + '">' + text + "</div>";
  };

  var total = daily.reduce(function (a, d) { return a + dayValue(d).mid; }, 0);
  var totalLo = daily.reduce(function (a, d) { return a + dayValue(d).lo; }, 0);
  var totalHi = daily.reduce(function (a, d) { return a + dayValue(d).hi; }, 0);

  var t = state.summary.tokens || {};
  var billable = t.billable_equiv || 0;
  var rawTotal = (t.cread || 0) + (t.cw5m || 0) + (t.cw1h || 0);
  var quotaPct = rawTotal > 0 ? Math.min(100, billable / rawTotal * 100) : 0;

  /* "That 3%, magnified" (mock 436-448): the quota-counted slice broken into
     its own three components -- cache write 1h, cache write 5m, output. */
  var magOut = t.out_tokens_est ? (t.out_tokens_est[0] + t.out_tokens_est[1]) / 2 : 0;
  var mag1h = t.cw1h || 0, mag5m = t.cw5m || 0;
  var magTotal = mag1h + mag5m + magOut;
  var mag1hPct = magTotal > 0 ? mag1h / magTotal * 100 : 0;
  var mag5mPct = magTotal > 0 ? mag5m / magTotal * 100 : 0;
  var magOutPct = magTotal > 0 ? magOut / magTotal * 100 : 0;

  /* mock 419: "the four tallest days" caption, always over daily granularity
     regardless of the day/week/total toggle on screen. */
  var dayVals = daily.map(function (d) { return dayValue(d).mid; }).sort(function (a, b) { return b - a; });
  var top4Sum = dayVals.slice(0, 4).reduce(function (a, v) { return a + v; }, 0);
  var top4Pct = total > 0 ? Math.round(top4Sum / total * 100) : 0;

  host.innerHTML =
    '<div style="display:grid;grid-template-columns:1fr 300px;gap:28px;margin-top:20px;padding:24px 28px 26px;background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)">' +
    "<div>" +
    '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:18px;flex-wrap:wrap">' +
    "<div>" +
    '<div style="font-family:var(--font-heading);font-size:12px;letter-spacing:0.09em;text-transform:uppercase;color:var(--color-neutral-500);margin-bottom:8px">Value the plan absorbed \u00b7 ' + (s.window_days || 30) + ' days</div>' +
    '<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">' +
    '<span style="font-family:var(--font-heading);font-weight:500;font-size:23px;letter-spacing:-0.02em;color:var(--color-neutral-200)">' + fmtUsd(total) + "</span>" +
    '<span style="font-size:13px;color:var(--color-neutral-500)">[' + fmtUsd(totalLo) + "\u2013" + fmtUsd(totalHi) + '] at API prices \u2014 not a bill, and not what your quota counts</span>' +
    "</div></div>" +
    '<div style="display:flex;gap:2px;padding:3px;background:var(--color-bg);border-radius:var(--radius-sm)">' +
    segBtn("day", "Per day") + segBtn("week", "Per week") + segBtn("total", "Running total") +
    "</div></div>" +
    '<div style="display:flex;align-items:baseline;gap:10px;height:22px;margin-bottom:10px;font-size:12.5px">' +
    '<span style="font-family:var(--font-heading);color:var(--color-neutral-200)">' + readoutLabel + "</span>" +
    '<span style="color:var(--color-neutral-500)">' + readoutDetail + "</span></div>" +
    '<div style="position:relative;padding-left:46px">' + ticksHtml +
    '<div style="position:relative;height:110px">' +
    '<svg viewBox="0 0 1000 110" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:110px;display:block;overflow:visible">' +
    "<defs>" +
    '<linearGradient id="ccheat" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">' + heatStops + "</linearGradient>" +
    '<linearGradient id="ccvalfill" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">' + fillStops + "</linearGradient>" +
    "</defs>" +
    '<polygon fill="url(#ccvalfill)" points="' + areaPts + '"></polygon>' +
    '<polyline fill="none" stroke="url(#ccheat)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="' + linePts + '"></polyline>' +
    marksHtml +
    "</svg>" +
    '<div style="position:absolute;inset:0;display:flex;z-index:4">' +
    series.map(function (x, i) { return '<div data-i="' + i + '" class="cc-dollar-hover" style="flex:1;height:100%;cursor:default"></div>'; }).join("") +
    "</div></div>" +
    '<div style="display:flex;margin-top:8px">' + barsAxis + "</div>" +
    '<div style="margin-top:18px;font-size:12.5px;color:var(--color-neutral-400);max-width:620px">The four tallest days are ' + fmtUsd(top4Sum) + " \u2014 " + top4Pct + "% of the month.</div>" +
    "</div></div>" +
    '<div style="padding-left:28px;border-left:1px solid var(--color-divider)">' +
    '<div style="font-family:var(--font-heading);font-size:12px;letter-spacing:0.09em;text-transform:uppercase;color:var(--color-neutral-500);margin-bottom:14px">What the quota counted</div>' +
    '<div style="display:flex;align-items:baseline;gap:8px"><span style="font-family:var(--font-heading);font-weight:500;font-size:23px;letter-spacing:-0.02em;color:var(--color-neutral-200)">' + fmtPct(quotaPct) + '</span><span style="font-size:12.5px;color:var(--color-neutral-500)">of ' + fmtTok(rawTotal) + " raw tokens</span></div>" +
    '<div style="font-size:12px;color:var(--color-neutral-600);margin-top:4px;margin-bottom:16px">Cache reads count at a fraction of full weight, so the quota-counted share is smaller than the raw total.</div>' +
    '<div style="display:flex;height:8px;border-radius:4px;overflow:hidden">' +
    '<div style="width:' + (100 - quotaPct) + '%;background:var(--lvl-1)"></div>' +
    '<div style="width:' + quotaPct + '%;background:var(--lvl-4);border-left:1px solid var(--color-surface)"></div>' +
    "</div>" +
    '<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:10.5px;color:var(--color-neutral-600)">' +

    '<div style="position:relative;margin-top:14px;padding:14px 14px 12px;background:var(--color-bg);border:1px solid var(--color-neutral-900);border-radius:var(--radius-md)">' +
    '<div style="font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:10px">That ' + fmtPct(quotaPct) + ', magnified</div>' +
    '<div style="display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:12px">' +
    '<div style="width:' + mag1hPct + '%;background:var(--lvl-4)"></div>' +
    '<div style="width:' + mag5mPct + '%;background:var(--lvl-3);border-left:1px solid var(--color-bg)"></div>' +
    '<div style="width:' + magOutPct + '%;background:var(--lvl-1);border-left:1px solid var(--color-bg)"></div>' +
    "</div>" +
    '<div style="display:flex;flex-direction:column;gap:9px">' +
    '<div style="display:flex;align-items:center;gap:9px;font-size:12px"><span style="width:6px;height:6px;border-radius:2px;background:var(--lvl-4)"></span><span style="flex:1;color:var(--color-neutral-400)">Cache write 1h</span><span style="color:var(--color-neutral-300)">' + fmtTok(mag1h) + "</span></div>" +
    '<div style="display:flex;align-items:center;gap:9px;font-size:12px"><span style="width:6px;height:6px;border-radius:2px;background:var(--lvl-3)"></span><span style="flex:1;color:var(--color-neutral-400)">Cache write 5m</span><span style="color:var(--color-neutral-300)">' + fmtTok(mag5m) + "</span></div>" +
    '<div style="display:flex;align-items:center;gap:9px;font-size:12px"><span style="width:6px;height:6px;border-radius:2px;background:var(--lvl-1)"></span><span style="flex:1;color:var(--color-neutral-400)">Output</span><span style="color:var(--color-neutral-300)">' + fmtTok(magOut) + "</span></div>" +
    "</div></div>" +
    '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:10.5px;color:var(--color-neutral-500)">' +
    '<span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:8px;border-radius:2px;background:var(--lvl-1)"></span>free</span>' +
    '<span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:8px;border-radius:2px;background:var(--lvl-3)"></span>costs a little</span>' +
    '<span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:8px;border-radius:2px;background:var(--lvl-4)"></span>costs the most</span>' +
    "</div>" +
    '<div style="margin-top:12px;font-size:12px;color:var(--color-neutral-400)">Writes are the half you can shrink \u2014 and they burn the weekly window fastest.</div>' +
    "</div></div>";

  document.getElementById("cc-dollars").querySelectorAll(".cc-range-btn").forEach(function (el) {
    el.addEventListener("click", function () { state.range = el.getAttribute("data-range"); state.hover = null; renderDollars(); });
  });
  document.getElementById("cc-dollars").querySelectorAll(".cc-dollar-hover, .cc-dollar-bar").forEach(function (el) {
    el.addEventListener("mouseenter", function () { state.hover = parseInt(el.getAttribute("data-i"), 10); renderDollars(); });
    el.addEventListener("mouseleave", function () { state.hover = null; renderDollars(); });
  });
}

/* ==== This week\u2019s windows (7x4 grid) + Heaviest windows table ====
   6.3: dry forced false when caps are unknown; legend/%->tokens swap. */
function renderWeek() {
  var host = document.getElementById("cc-week");
  var w = state.windows;
  if (!w) { host.innerHTML = ""; return; }
  var capsKnown = w.caps_known;
  var grid = w.week || [];
  var maxTok = 0;
  grid.forEach(function (row) { (row.cells || []).forEach(function (c) { if (c && c.equiv_tokens > maxTok) maxTok = c.equiv_tokens; }); });

  function cellHtml(c) {
    if (!c) {
      return '<div style="flex:1;display:flex;gap:2px;align-items:center;height:20px;border:2px solid var(--l0);padding:2px">' +
        '<div style="width:6px;height:12px;background:transparent"></div>' +
        pxMeter(0, 7, "var(--l0)", null, "height:12px") +
        "</div>";
    }
    var led = c.leader ? modelColor(shortModel(c.leader)) : "transparent";
    var edge, fillPct, on;
    if (capsKnown) {
      edge = c.dry ? "var(--l4)" : "transparent";
      fillPct = c.pct_of_week;
      on = PX_LVL[pxLvl(c.pct_of_cap)];
    } else {
      edge = "transparent";
      fillPct = maxTok > 0 ? (c.equiv_tokens / maxTok * 100) : 0;
      on = "var(--line)";
    }
    fillPct = Math.max(0, Math.min(100, fillPct || 0));
    return '<div style="flex:1;display:flex;gap:2px;align-items:center;height:20px;border:2px solid ' + edge + ';padding:2px">' +
      '<div style="width:6px;height:12px;background:' + led + '"></div>' +
      pxMeter(fillPct, 7, on, null, "height:12px") +
      "</div>";
  }

  var rowsHtml = grid.map(function (row) {
    var cells = (row.cells || []).slice();
    while (cells.length < 4) cells.push(null);
    var cellsHtml = cells.map(cellHtml).join("");
    var labelColor = (row.blocks || 0) > 2 ? "var(--ink)" : "var(--dim)";
    var qualifying = cells.filter(function (c) { return c && ((c.equiv_tokens || c.turns) > 0); });
    var tail, tailColor;
    if (capsKnown) {
      if (qualifying.length) {
        var avg = Math.round(qualifying.reduce(function (a, c) { return a + (c.pct_of_cap || 0); }, 0) / qualifying.length);
        tail = avg + "% AVG";
        tailColor = PX_LVL[pxLvl(avg)];
      } else {
        tail = "—";
        tailColor = "var(--dim)";
      }
    } else {
      var sum = cells.reduce(function (a, c) { return a + (c ? (c.equiv_tokens || 0) : 0); }, 0);
      tail = fmtTok(sum);
      tailColor = "var(--dim)";
    }
    return '<div style="display:flex;align-items:center;gap:10px">' +
      '<div style="width:30px;color:' + labelColor + ';text-transform:uppercase">' + esc(row.day) + "</div>" +
      cellsHtml +
      '<div style="width:78px;text-align:right;color:' + tailColor + '">' + tail + "</div>" +
      "</div>";
  }).join("");

  var dryHeader = capsKnown
    ? '<span style="color:var(--l4)">' + (w.dry_count_week ?? "?") + " RAN DRY</span>"
    : '<span style="color:var(--dim)">CAP UNKNOWN — NO DRY COUNT</span>';

  var led = w.led_counts || {};
  var ledKeys = Object.keys(led);
  var ledLegend = ledKeys.map(function (m, i) {
    var prefix = i === 0 ? "LED BY " : "";
    return '<span style="display:flex;align-items:center;gap:6px"><span style="width:6px;height:10px;background:' + modelColor(shortModel(m)) + '"></span>' + prefix + shortModel(m).toUpperCase() + " " + led[m] + "</span>";
  }).join("");

  var lvlLegend = capsKnown
    ? '<span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:10px;background:var(--l1)"></span>ROOM</span>' +
      '<span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:10px;background:var(--l2)"></span>HALF</span>' +
      '<span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:10px;background:var(--l3)"></span>TIGHT</span>' +
      '<span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:10px;background:var(--l4)"></span>DRY</span>'
    : '<span style="color:var(--dim)">TOKENS SHOWN, NOT FILL — CAP UNKNOWN</span>';

  host.innerHTML =
    '<div class="px-panel" style="margin-top:20px">' +
    '<div style="display:flex;justify-content:space-between;margin-bottom:14px">' +
    '<span class="px-label">THIS WEEK · ' + (w.week_blocks || 0) + ' WINDOWS</span>' +
    dryHeader +
    "</div>" +
    '<div style="display:flex;flex-direction:column;gap:6px">' + rowsHtml + "</div>" +
    '<div style="display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;color:var(--dim)">' + lvlLegend + '<span style="flex:1"></span>' + ledLegend + "</div>" +
    "</div>";
}

function renderFooter() {
  var host = document.getElementById("cc-footer");
  var m = state.meta;
  if (!m) { host.innerHTML = ""; return; }
  var w = state.windows;
  var quotaSpan = "";
  if (w && w.source) {
    var srcLabel = w.source === "statusline_hook" ? "THE STATUSLINE HOOK" :
      w.source === "usage_cache" ? "THE /USAGE CACHE" : esc(String(w.source).toUpperCase());
    quotaSpan = "<span>QUOTA FROM " + srcLabel + "</span>";
  } else if (w && w.setup_cmd) {
    quotaSpan = "<span>QUOTA OFF · " + esc(w.setup_cmd) + "</span>";
  }
  host.innerHTML =
    '<div style="display:flex;flex-wrap:wrap;gap:24px;margin-top:22px;padding-top:14px;border-top:2px solid var(--line);color:#6f695f">' +
    '<span>READ-ONLY · NOTHING LEAVES THIS MACHINE</span>' +
    quotaSpan +
    '<span style="flex:1"></span>' +
    '<span>CCMETRICS ' + esc(m.version) + " · " + esc(m.corpus_files) + " SESSION FILES · LAST INGEST " + esc(m.last_ingest ? fmtClock(m.last_ingest) : "—") + "</span>" +
    "</div>";
}

/* ==== boot ==== */
var _booting = false;
function boot() {
  if (_booting) return;
  _booting = true;
  var qWindows = scopedUrl("/api/windows");
  var qSummary = state.scope ? "/api/project/" + encodeURIComponent(state.scope) : "/api/summary";
  var qFindings = scopedUrl("/api/findings");
  Promise.all([
    get("/api/projects"), get(qWindows), get("/api/live" + (state.scope ? "?project=" + encodeURIComponent(state.scope) : "")),
    get(qFindings), get(qSummary), get("/api/meta")
  ]).then(function (r) {
    state.projects = r[0]; state.windows = r[1]; state.live = r[2];
    state.findings = r[3]; state.summary = r[4]; state.meta = r[5];
    renderAll();
    _booting = false;
  }).catch(function (err) {
    _booting = false;
    var host = document.getElementById("cc-header");
    host.innerHTML = '<div style="color:var(--color-neutral-400);font-size:13px">ccmetrics \u2014 could not reach the dash server (' + esc(err.message || err) + ")</div>";
  });
}

function renderAll() {
  renderHeader();
  renderRibbon();
  renderHero();
  renderLive();
  renderHorizon();
  renderRecoverable();
  renderProjects();
  renderDollars();
  renderWeek();
  renderFooter();
}

boot();
var POLL_MS = (state.meta && state.meta.poll_seconds ? state.meta.poll_seconds : 20) * 1000;
setInterval(function () {
  get("/api/live" + (state.scope ? "?project=" + encodeURIComponent(state.scope) : "")).then(function (live) {
    state.live = live; renderLive();
  }).catch(function () {});
}, 20000);
setInterval(boot, 60000);

})();
</script>
</body>
</html>
