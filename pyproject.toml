[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccmetrics"
version = "0.2.0"
description = "Read-only leak meter for Claude Code sessions: where the tokens go, what it floors at, what to paste to fix it."
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }

[project.scripts]
ccmetrics = "ccmetrics.cli:main"

[tool.setuptools]
packages = ["ccmetrics", "ccmetrics.dash"]

[tool.setuptools.package-data]
"ccmetrics.dash" = ["static/*"]
